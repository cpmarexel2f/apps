  services:
    name: Servisi
    description: Ova opcija vam omogućava da definišete srv-host zapise.
  cnames:
    name: CNAME zapisi
    description: Definišite CNAME zapise koje će DNSMasq razrešavati.
  txts:
    name: TXT zapisi
