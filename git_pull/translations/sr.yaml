---
configuration:
  repository:
    name: Репозиторијум
    description: Git URL адреса вашег репозиторијума.
  git_branch:
    name: Git грана
    description: >-
      Назив гране Git репозиторијума. Ако оставите празно, ажурираће се
      тренутно активна грана. Оставите вредност 'master' ако нисте сигурни.
  git_remote:
    name: Удаљени Git репозиторијум
    description: >-
      Назив праћеног репозиторијума. Оставите вредност `origin` ако нисте сигурни.
  auto_restart:
    name: Аутоматско поновно покретање
    description: >-
      Поново покреће Home Assistant када се конфигурација промени (и ако је исправна).
  restart_ignore:
    name: Изузеци од поновног покретања
    description: >-
      Када је омогућено `auto_restart`, измене у овим датотекама неће покренути
      поновно покретање HA-а. Могу се навести и цели директоријуми за игнорисање.
  git_command:
    name: Git команда
    description: Команда која се извршава. Оставите вредност `pull` ако нисте сигурни.
  git_prune:
    name: Git чишћење (Prune)
    description: >-
      Ако је омогућено, апликација ће уклонити гране које су обрисане на
      удаљеном репозиторијуму, али и даље постоје у кешу на локалној машини.
      Оставите вредност `false` ако нисте сигурни.
  deployment_key:
    name: Кључ за постављање
    description: >-
      Приватни SSH кључ који ће се користити за комуникацију током Git
      операција.
  deployment_user:
    name: Корисник за постављање
    description: >-
      Корисничко име које се користи приликом аутентификације на репозиторијуму
      помоћу корисничког имена и лозинке.
  deployment_password:
    name: Лозинка за постављање
    description: >-
      Лозинка која се користи приликом аутентификације на репозиторијуму. Занемарује
      се ако `deployment_user` није подешен.
  deployment_key_protocol:
    name: Протокол кључа за постављање
    description: Протокол кључа
  repeat:
    name: Периодична провера
    description: >-
      Подешава апликацију Git pull да аутоматски и периодично проверава да ли
      постоје ажурирања у репозиторијуму.
