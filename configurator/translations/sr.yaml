---
configuration:
  dirsfirst:
    name: Прво директоријуми
    description: >-
      Ова опција омогућава приказивање директоријума пре датотека у стаблу
      прегледача датотека.
  enforce_basepath:
    name: Ограничи на основну путању
    description: >-
      Ако је подешено на `true`, приступ је ограничен на датотеке унутар
      директоријума `/config`.
  git:
    name: Git
    description: >-
      Ако је подешено на `true`, апликација ће иницијализовати git за директоријуме
      који га подржавају.
  ignore_pattern:
    name: Шаблон за игнорисање
    description: >-
      Ова опција омогућава сакривање датотека и фасцикли из стабла прегледача
      датотека.
  log_level:
    name: Ниво евиденције (Log Level)
    description: >-
      Одређује обим бележења евиденције уређивача датотека. На нивоу `info` бележи
      се сваки веб захтев, укључујући Docker проверу исправности на сваких 30 секунди;
      `warning` бележи само проблеме.
  ssh_keys:
    name: SSH кључеви
    description: >-
      Листа назива датотека које садрже приватне SSH кључеве. Могу се користити за
      омогућавање приступа удаљеним git репозиторијумима.
