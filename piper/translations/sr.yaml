---
configuration:
  backend:
    name: Позадински систем
    description: >-
      Систем за претварање текста у говор. `piper` је брз и ради на сваком
      хардверу. `omnivoice` је експерименталан: знатно је квалитетнији и подржава
      клонирање гласа, али је много спорији и захтева десктоп или серверски
      процесор. Радиће и на другом хардверу, али очекујте да буде преспор
      за практичну употребу.
  voice:
    name: Глас
    description: >-
      Piper глас који ће се користити. Гласови су именовани према следећој
      шеми: `<језик>-<име>-<квалитет>`. Занемарује се када је позадински систем
      `omnivoice`, који бира глас за сваки појединачни захтев.
  speaker:
    name: Говорник
    description: >-
      Број говорника који се користи ако глас подржава више говорника.
      Подразумевано се користи први говорник (говорник 0).
  length_scale:
    name: Брзина говора
    description: >-
      Убрзава или успорава глас. Вредност 1.0 означава подразумевану брзину
      говора, при чему је < 1.0 брже, а > 1.0 спорије.
  noise_scale:
    name: Ниво шума 
    description: >-
      Контролише варијабилност звука додавањем шума током генерисања говора.
      Ефекат у великој мери зависи од самог гласа, али уопштено вредност 0
      уклања варијабилност, док вредности изнад 1 почињу да кваре звук.
  noise_w:
    name: Ритам говора
    description: >-
      Контролише варијабилност ритма говора (трајање фонема). Ефекат у великој
      мери зависи од самог гласа, али уопштено вредност 0 уклања варијабилност,
      док вредности изнад 1 изазивају изразито замуцкивање и паузе.
  sentence_silence:
    name: Тишина након реченице
    description: >-
      Додаје задати број секунди тишине после сваке реченице.
  omnivoice_steps:
    name: OmniVoice кораци
    description: >-
      Број корака декодирања за `omnivoice` позадински систем. Мање корака
      значи бржи рад, а више корака бољи звук. Користи се само када је изабран
      `omnivoice`.
  enable_japanese:
    name: Подршка за јапански језик
    description: >-
      Преузима јапански фонемизер, неопходан за гласове на јапанском језику. При
      првом укључивању преузима се око 350 MB података.
  enable_thai:
    name: Подршка за тајландски језик
    description: >-
      Преузима тајландски фонемизер, неопходан за гласове на тајландском језику. При
      првом укључивању преузима се око 390 MB података.
  update_voices:
    name: Ажурирање гласова
    description: >-
      Аутоматски преузима листу нових гласова при сваком покретању апликације.
      Потребно је и да поново учитате Wyoming интеграцију за Piper у Home
      Assistant-у како бисте видели нове гласове.
  debug_logging:
    name: Евиденција за отклањање грешака
    description: >-
      Уписује поруке DEBUG нивоа у евиденцију апликације.
network:
  10200/tcp: Piper Wyoming протокол
