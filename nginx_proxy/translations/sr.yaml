---
configuration:
  domain:
    name: Домен
    description: Назив домена који ће се користити за прокси.
  hsts:
    name: HSTS
    description: >-
      Вредност HSTS HTTP заглавља које се шаље. Ако је празно, заглавље се не шаље.
  certfile:
    name: Датотека сертификата
    description: >-
      Датотека сертификата из директоријума `/ssl` која ће се користити.
  keyfile:
    name: Датотека приватног кључа
    description: Датотека приватног кључа из директоријума `/ssl` која ће се користити.
  cloudflare:
    name: CloudFlare
    description: >-
      Ако је укључено, подешава Nginx са листом IP адреса директно са
      Cloudflare-а које ће се користити за директиву `set_real_ip_from` у Nginx
      конфигурацији.
  use_ssl_backend:
    name: Користи SSL позадински сервер
    description: >-
      Ако је укључено, подешава Nginx да користи SSL за повезивање са позадинским сервером.
  client_max_body_size_megabytes:
    name: Максимална величина захтева (у MB)
    description: >-
      Подешава Nginx да ограничи максималну дозвољену величину тела клијентског
      захтева, изражену у мегабајтима. Поставите на 0 за захтеве било које величине.
  customize:
    name: Прилагођавање
    description: >-
      Погледајте картицу Документација за више информација о овим опцијама.
  real_ip_from:
    name: Стварна IP адреса од (омогућава PROXY протокол)
    description: >-
      Подешава Nginx да користи TCP Proxy протокол,
      одређује којој IP адреси се верује за долазне TLS захтеве.
network:
  443/tcp: HTTPS (SSL) порт
  443/udp: HTTP/3 (QUIC) порт, поставите на исти као HTTPS (SSL) порт да бисте омогућили HTTP/3
  80/tcp: HTTP (не-SSL) порт
