---
configuration:
  awake_wav:
    name: WAV звук буђења
    description: >-
      Путања до WAV датотеке која се пушта када се препозна реч за буђење (празно за онемогућавање).
  done_wav:
    name: WAV звук завршетка
    description: >-
      Путања до WAV датотеке која се пушта када се гласовна команда заврши (празно за
      онемогућавање).
  timer_finished_wav:
    name: WAV звук истека тајмера
    description: >-
      Путања до WAV датотеке која се пушта када тајмер истекне (празно за онемогућавање,
      подразумевано је /usr/src/sounds/timer_finished.wav).
  timer_repeat_count:
    name: Број понављања звука истека тајмера
    description: >-
      Број понављања датотеке timer_finished_wav (подразумевано је 3).
  timer_repeat_delay:
    name: Пауза између понављања тајмера
    description: >-
      Задржавање пре понављања датотеке timer_finished_wav, у секундама (подразумевано је 0.75).
  noise_suppression:
    name: Потискивање шума
    description: >-
      Ниво потискивања шума (0 је онемогућено, 4 је максимум).
  auto_gain:
    name: Аутоматско појачање
    description: >-
      Аутоматско појачавање јачине звука микрофона (0 је онемогућено, 31 је максимум).
  mic_volume_multiplier:
    name: Множилац јачине микрофона
    description: >-
      Множи јачину звука микрофона фиксном вредношћу (1.0 = без промене, 2.0 = двоструко
      гласније).
  sound_enabled:
    name: Звук омогућен
    description: >-
      Омогућава или онемогућава излазни звук.
  sound_volume_multiplier:
    name: Множилац јачине излазног звука
    description: >-
      Множи јачину излазног звука фиксном вредношћу (1.0 = без промене, 2.0 = двоструко
      гласније). Подразумевана вредност је 1.0.
  debug_logging:
    name: Евиденција за отклањање грешака
    description: >-
      Омогућава евиденцију за отклањање грешака.
