---
configuration:
  domains:
    name: Домени
    description: >-
      Листа DuckDNS поддомена регистрованих на вашем налогу. Прихватљив
      формат назива је `moj-domen.duckdns.org`.
  token:
    name: Токен
    description: >-
      DuckDNS токен за аутентификацију који се налази на врху почетне странице
      вашег DuckDNS налога. Токен је неопходан за било какве измене на
      поддоменима регистрованим на вашем налогу.
  aliases:
    name: Алијаси
    description: Листа алијаса домена подешених у опцији `domains`.
  lets_encrypt:
    name: Let's Encrypt
    description: Подешавање Let's Encrypt опција
  seconds:
    name: Секунде
    description: >-
      Број секунди чекања пре ажурирања DuckDNS поддомена и
      обнављања Let's Encrypt сертификата.
  ipv4:
    name: IPv4
    description: >-
      Подразумевано ће DuckDNS аутоматски открити вашу IPv4 адресу и њу користити.
      Ова опција вам омогућава да заобиђете аутоматско откривање и ручно
      унесете IPv4 адресу. Вредност 'none' онемогућава IPv4 ажурирања.
  ipv6:
    name: IPv6
    description: >-
      DuckDNS тренутно не може аутоматски да открије вашу IPv6 адресу. Ова опција
      омогућава да наведете 'default' или назив интерфејса за коришћење IPv6
      адресе хоста, или алтернативно можете ручно унети адресу.
