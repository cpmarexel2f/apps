---
configuration:
  domains:
    name: Домени
    description: >-
      Називи домена за које се издају сертификати, користите "*.vasdomen.com" за
      заменске (wildcard) сертификате.
  email:
    name: Е-пошта
    description: Адреса е-поште која ће бити регистрована за сертификат.
  keyfile:
    name: Датотека приватног кључа
    description: Путања на коју ће бити смештена датотека приватног кључа.
  certfile:
    name: Датотека сертификата
    description: Путања на коју ће бити смештена датотека сертификата.
  challenge:
    name: Провера
    description: Врста провере која се користи за потврду власништва над доменом.
  acme_server:
    name: Прилагођени ACME сервер
    description: >-
      Подразумевано ова апликација користи Let's Encrypt сервере. Међутим, можете
      навести други ACME сервер.
  acme_root_ca_cert:
    name: ACME коренски CA сертификат
    description: >-
      Релевантно само за прилагођени ACME сервер који користи сертификат потписан од стране
      непоузданог сертификационог тела (CA) које је потребно додати у складиште
      поузданих сертификата.
  dns:
    name: DNS
    description: Подешавање DNS провајдера
  key_type:
    name: Тип кључа
    description: >-
      Изаберите тип кључа сертификата. Ако није подешено, аутоматски ће се препознати на основу
      типа кључа постојећег сертификата или ће се подразумевано користити ecdsa.
  elliptic_curve:
    name: Елиптична крива
    description: >-
      Елиптична крива за ECDSA кључеве. Ова опција се мора користити када је Тип кључа
      подешен на ECDSA. Ако није подешено, користиће се подразумевана вредност за Certbot.
  dry_run:
    name: Пробни рад
    description: >-
      Покреће пробни рад certbot-а за захтевање сертификата од Let's Encrypt-а.
      Занемарује се ако се користи прилагођени сервер.
  test_cert:
    name: Издај пробне сертификате
    description: >-
      Преузима пробни сертификат са Let's Encrypt тестног (staging) сервера.
      Занемарује се ако се користи прилагођени сервер.
  verbose:
    name: Детаљан режим
    description: >-
      Покреће certbot у детаљном режиму приказа евиденције.
  force_renew:
    name: Принудно обнављање
    description: >-
      Принуђује обнављање сертификата чак и ако није близу истека.
network:
  80/tcp: Потребно само за HTTP проверу
