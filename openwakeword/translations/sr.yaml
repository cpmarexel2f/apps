---
configuration:
  threshold:
    name: Праг осетљивости
    description: >-
      Праг активације (0–1), где виша вредност значи мање активација. Погледајте
      ниво окидања за однос између активација и препознавања речи за
      буђење.
  trigger_level:
    name: Ниво окидања
    description: >-
      Број активација пре него што се региструје препознавање. Виши ниво
      окидања значи мање препознавања.
  debug_logging:
    name: Евиденција за отклањање грешака
    description: >-
      Омогућава евиденцију за отклањање грешака. Корисно за праћење сваког
      препознавања речи за буђење у евиденцији.
network:
  10400/tcp: openWakeWord Wyoming протокол
